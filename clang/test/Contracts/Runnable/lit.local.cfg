import os

# The runnable contract tests link against the just-built libc++ (for
# <contracts> and the contract-violation runtime). %libcxx_flags selects it,
# and the "contracts-libcxx" feature is only available when it was built, so
# tests that need it should say "REQUIRES: contracts-libcxx".
_libcxx_libdir = None
for _candidate in (
    os.path.join(config.llvm_obj_root, "lib", config.target_triple),
    os.path.join(config.llvm_obj_root, "lib"),
):
    if any(
        os.path.exists(os.path.join(_candidate, "libc++" + ext))
        for ext in (".so", ".dylib", ".a")
    ):
        _libcxx_libdir = _candidate
        break

# %libcxx_static_flags links the static libc++ and libc++abi (and libunwind,
# if libc++abi was built on it) instead; the "contracts-libcxx-static" feature
# is available when the archives were built.
_libcxx_static_flags = None
if _libcxx_libdir is not None:
    config.available_features.add("contracts-libcxx")
    _libcxx_flags = "-stdlib=libc++ -L{0} -Wl,-rpath,{0}".format(_libcxx_libdir)
    _archives = [
        os.path.join(_libcxx_libdir, "libc++.a"),
        os.path.join(_libcxx_libdir, "libc++abi.a"),
    ]
    if all(os.path.exists(a) for a in _archives):
        config.available_features.add("contracts-libcxx-static")
        _unwind = os.path.join(_libcxx_libdir, "libunwind.a")
        if os.path.exists(_unwind):
            _archives.append(_unwind)
        _libcxx_static_flags = "-stdlib=libc++ -nostdlib++ " + " ".join(_archives)
else:
    _libcxx_flags = "-stdlib=libc++"

config.substitutions = list(config.substitutions)
config.substitutions.insert(0, ("%libcxx_flags", _libcxx_flags))
config.substitutions.insert(0, ("%libcxx_static_flags", _libcxx_static_flags or ""))
